if (localStorage.getItem('tecnicos_v15')) {
    colaboradores = JSON.parse(localStorage.getItem('tecnicos_v15'));
}

function atualizarSelect() {
    const select = document.getElementById('selectColaboradores');
    select.innerHTML = '<option value="">Selecione...</option>';
    colaboradores.sort().forEach(nome => {
        const isSelected = equipeSelecionada.includes(nome);
        select.innerHTML += `<option value="${nome}" ${isSelected ? 'disabled' : ''}>${nome} ${isSelected ? '✔' : ''}</option>`;
    });
    renderizarListaAdmin();
}

function renderizarListaAdmin() {
    const list = document.getElementById('listaAdminColaboradores');
    list.innerHTML = '';
    colaboradores.sort().forEach(nome => {
        list.innerHTML += `<div class="colab-item"><span>${nome}</span><button class="btn-del" onclick="excluirColaborador('${nome}')">Remover</button></div>`;
    });
}

function toggleModal(show) { document.getElementById('modalEquipe').style.display = show ? 'flex' : 'none'; }

function adicionarColaborador() {
    const select = document.getElementById('selectColaboradores');
    const nome = select.value;
    if (nome && !equipeSelecionada.includes(nome)) {
        equipeSelecionada.push(nome);
        renderBadges();
        atualizarSelect();
        salvarRascunho();
    }
    select.value = "";
}

function removerBadge(nome) {
    equipeSelecionada = equipeSelecionada.filter(n => n !== nome);
    renderBadges();
    atualizarSelect();
    salvarRascunho();
}

function renderBadges() {
    const container = document.getElementById('badgesEquipe');
    container.innerHTML = '';
    equipeSelecionada.forEach(nome => {
        container.innerHTML += `<div class="badge">${nome}<span onclick="removerBadge('${nome}')">&times;</span></div>`;
    });
}

function addNovoColab() {
    const n = document.getElementById('novoNome').value.trim();
    if (n) {
        colaboradores.push(n);
        localStorage.setItem('tecnicos_v15', JSON.stringify(colaboradores));
        atualizarSelect();
        document.getElementById('novoNome').value = '';
    }
}

function excluirColaborador(nome) {
    if(confirm(`Remover ${nome}?`)) {
        colaboradores = colaboradores.filter(n => n !== nome);
        localStorage.setItem('tecnicos_v15', JSON.stringify(colaboradores));
        atualizarSelect();
    }
}

function atualizarDataHora() {
    const agora = new Date();
    document.getElementById('data_auto').value = agora.toLocaleDateString('pt-BR');
    document.getElementById('hora_auto').value = agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
}

function verificarStatusGeral() {
    const statusVal = document.getElementById('status').value;
    const grupoProgresso = document.getElementById('grupoProgresso');
    const selectProgresso = document.getElementById('progresso_hoje');
    const grupoEtapaHoje = document.getElementById('grupoEtapaHoje');
    const inputEtapaHoje = document.getElementById('etapa_hoje');

    if (statusVal === "Concluído") {
        grupoProgresso.style.display = "block";
        selectProgresso.value = "Atividade finalizada";
        selectProgresso.disabled = true;

        grupoEtapaHoje.style.display = "none";
        inputEtapaHoje.removeAttribute("required");
        inputEtapaHoje.value = "";
    } else if (statusVal === "Em Andamento") {
        grupoProgresso.style.display = "block";
        selectProgresso.value = "🏁 Concluída hoje(continua)";
        selectProgresso.disabled = true;

        grupoEtapaHoje.style.display = "block";
        inputEtapaHoje.setAttribute("required", "required");
    } else if (statusVal === "Pendente") {
        grupoProgresso.style.display = "block";
        selectProgresso.disabled = false;
        selectProgresso.setAttribute("required", "required");
        if (selectProgresso.value === "🏁 Concluída hoje(continua)") {
            selectProgresso.value = "";
        }

        grupoEtapaHoje.style.display = "block";
        inputEtapaHoje.setAttribute("required", "required");
    } else {
        grupoProgresso.style.display = "none";
        selectProgresso.disabled = false;
        selectProgresso.removeAttribute("required");
        selectProgresso.value = "";

        grupoEtapaHoje.style.display = "none";
        inputEtapaHoje.removeAttribute("required");
        inputEtapaHoje.value = "";
    }
}

function salvarRascunho() {

    const statusVal = document.getElementById('status').value;
    const progressoVal = document.getElementById('progresso_hoje').value;
    const temEtapa = (statusVal === "Pendente" || statusVal === "Em Andamento");

    const deveReiniciarProximaVez = (statusVal === "Concluído" || (temEtapa && progressoVal === "🏁 Concluída hoje(continua)"));

    const dadosRascunho = {
        atividade: document.getElementById('atividade').value,
        etapa_hoje: temEtapa ? document.getElementById('etapa_hoje').value : '',
        chamado: document.getElementById('chamado').value,
        equipe: equipeSelecionada,
        site: document.getElementById('site').value,
        local: document.getElementById('local').value,
        skymunck: document.getElementById('skymunck').value,
        status: statusVal,
        progresso: statusVal === "Concluído" ? "Atividade finalizada" : (statusVal === "Em Andamento" ? "🏁 Concluída hoje(continua)" : (temEtapa ? progressoVal : '')),
        obs: document.getElementById('comentarios').value,
        deveReiniciarProximaVez: deveReiniciarProximaVez
    };
    localStorage.setItem('rascunho_atividade_v1', JSON.stringify(dadosRascunho));
}

function carregarRascunho() {
    const salvo = localStorage.getItem('rascunho_atividade_v1');
    if (salvo) {
        const d = JSON.parse(salvo);

        if (d.deveReiniciarProximaVez && d.status === "Concluído") {
            localStorage.removeItem('rascunho_atividade_v1');
            document.getElementById('status').value = "Iniciado hoje";
        } else if (d.deveReiniciarProximaVez) {
            let nomeOriginal = d.atividade || '';
            if (nomeOriginal.startsWith("Continuação: ")) {
                nomeOriginal = nomeOriginal.replace("Continuação: ", "");
            }
            document.getElementById('atividade').value = "Continuação: " + nomeOriginal;
            document.getElementById('chamado').value = d.chamado || '';
            equipeSelecionada = d.equipe || [];
            renderBadges();
            document.getElementById('site').value = d.site || '';
            document.getElementById('local').value = d.local || '';
            document.getElementById('skymunck').value = d.skymunck || 'Não';

            document.getElementById('status').value = "Iniciado hoje";
            document.getElementById('progresso_hoje').value = '';
            document.getElementById('etapa_hoje').value = '';
            document.getElementById('comentarios').value = '';

            salvarRascunho();
        } else {
            document.getElementById('atividade').value = d.atividade || '';
            document.getElementById('chamado').value = d.chamado || '';
            equipeSelecionada = d.equipe || [];
            renderBadges();
            document.getElementById('site').value = d.site || '';
            document.getElementById('local').value = d.local || '';
            document.getElementById('skymunck').value = d.skymunck || 'Não';
            document.getElementById('status').value = d.status || "Iniciado hoje";
            document.getElementById('progresso_hoje').value = d.progresso || '';
            document.getElementById('etapa_hoje').value = d.etapa_hoje || '';
            document.getElementById('comentarios').value = d.obs || '';
        }
    } else {
        document.getElementById('status').value = "Iniciado hoje";
    }
    verificarStatusGeral();
}

function limparFormularioTotal() {
    if (confirm("Deseja realmente limpar todos os campos e resetar o rascunho salvo?")) {
        localStorage.removeItem('rascunho_atividade_v1');
        document.getElementById('mainForm').reset();
        document.getElementById('progresso_hoje').disabled = false;
        equipeSelecionada = [];
        renderBadges();
        atualizarSelect();
        atualizarDataHora();
        document.getElementById('status').value = "Iniciado hoje";
        verificarStatusGeral();
    }
}
